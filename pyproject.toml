[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "biopgp"
version = "0.8.0"
description = "Local encrypted files and mountable biometric containers"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy==2.5.2",
    "opencv-python==4.14.0.94",
    "PyNaCl==1.6.2",
    "PySide6==6.11.2",
    "refuse==0.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]
packaging = [
    "pyinstaller==6.21.0",
]

[project.scripts]
biopgp = "biopgp.app:main"
biopgp-shell = "biopgp.shell:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biopgp = ["locales/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
